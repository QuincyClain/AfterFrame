<div class="trailer-overlay" (click)="closed.emit()">
  <section
    class="trailer-dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="trailer-dialog-title"
    (click)="$event.stopPropagation()"
  >
    <header class="dialog-header">
      <div>
        <p>Trailer</p>
        <h2 id="trailer-dialog-title">{{ title() }}</h2>
      </div>

      <button type="button" aria-label="Close trailer" autofocus (click)="closed.emit()">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M18 6 6 18M6 6l12 12" />
        </svg>
      </button>
    </header>

    <div class="video-frame">
      <iframe
        [src]="embedUrl()"
        [title]="title()"
        allow="
          accelerometer;
          autoplay;
          clipboard-write;
          encrypted-media;
          gyroscope;
          picture-in-picture;
          web-share;
        "
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen
      ></iframe>
    </div>
  </section>
</div>
